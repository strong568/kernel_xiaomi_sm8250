name: Build strongerkernel - Neutron Clang

on:
  workflow_dispatch:
    inputs:
      BUILD_TITLE:
        description: 'Custom Build Title'
        required: false
      KERNEL_TREE:
        description: 'Kernel Tree'
        default: 'https://github.com/strong568/kernel_xiaomi_sm8250'
        required: true
      KERNEL_TREE_BRANCH:
        description: 'Kernel Tree Branch'
        required: true
        default: 'stable'
      CODENAME:
        description: 'Phone Codename'
        default: 'munch'
        required: true
      DEFCONFIG:
        description: 'Defconfig target'
        default: 'vendor/munch_user_defconfig'
        required: true
      ANYKERNEL_URL:
        description: 'AnyKernel Url (leave blank to skip AnyKernel)'
        default: 'https://github.com/nunkki/Anykernel3-Munch'
        required: false
      ANYKERNEL_BRANCH:
        description: 'AnyKernel Branch'
        default: 'strongerkernel_munch'
        required: false
      ENABLE_KERNELSU:
        description: 'KernelSU'
        type: boolean
        default: true
      WHICH_KSU:
        type: choice
        description: 'Choose the fork of KSU to use'
        options: 
          - KSU-Next (rifsxd)
          - MSKU (5ec1cff)
          - RKSU (rsuntk)
          - XXKSU (backslashxx)
          - KOWX712 (KOWX712)
          - XXKSU-SUSFS (zenwav)

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    
      - name: Display User Inputs
        run: |
          echo "::group::User Environment Variables"
          echo "Custom Build Title: ${{ github.event.inputs.BUILD_TITLE }}"
          echo "Kernel Tree: ${{ github.event.inputs.KERNEL_TREE }} (${{ github.event.inputs.KERNEL_TREE_BRANCH }})"
          echo "Codename: ${{ github.event.inputs.CODENAME }}"
          echo "Defconfig: ${{ github.event.inputs.DEFCONFIG }}"
          echo "KernelSU: ${{ github.event.inputs.ENABLE_KERNELSU && 'Yes' || 'No' }} (${{ github.event.inputs.WHICH_KSU }})"
          echo "::endgroup::"

      - name: Initialize Workspace
        id: workspace
        run: |
          mkdir -p workspace
          echo "workspace_dir=$GITHUB_WORKSPACE/workspace" >> $GITHUB_OUTPUT
          echo "start_time=$(date +\%s)" >> $GITHUB_OUTPUT
          echo "build_title=${{ github.event.inputs.BUILD_TITLE || github.event.inputs.CODENAME }}" >> $GITHUB_OUTPUT

      - name: Setup Build Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y -qq \
            libarchive-tools binutils git make bc bison openssl curl zip kmod cpio flex \
            libelf-dev libssl-dev libtfm-dev libc6-dev device-tree-compiler ca-certificates \
            python3 xz-utils aria2 build-essential ccache libncurses-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          mkdir -p ~/.ccache
          ccache --set-config=max_size=2.0G
          ccache --set-config=compression=true
          ccache -z

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref_name }}-

      - name: Setup Neutron Clang
        working-directory: ${{ steps.workspace.outputs.workspace_dir }}
        run: |
          mkdir -p clang
          cd clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Display Toolchain Version
        run: |
          clang --version
          ld.lld --version

      - name: Clone Kernel Source
        id: kernel
        working-directory: ${{ steps.workspace.outputs.workspace_dir }}
        run: |
          git clone --depth=1 ${{ github.event.inputs.KERNEL_TREE }} -b${{ github.event.inputs.KERNEL_TREE_BRANCH }} kernel_tree
          echo "kernel_dir=${{ steps.workspace.outputs.workspace_dir }}/kernel_tree" >> $GITHUB_OUTPUT

      - name: Add KernelSU
        if: ${{ github.event.inputs.ENABLE_KERNELSU == 'true' || github.event.inputs.ENABLE_KERNELSU == true }}
        working-directory: ${{ steps.kernel.outputs.kernel_dir }}
        run: |
          [ -d "KernelSU" ] && rm -rf KernelSU drivers/kernelsu

          case "${{ github.event.inputs.WHICH_KSU }}" in
            "MSKU (5ec1cff)")
              curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/main/kernel/setup.sh" | bash -s main
              ;;
            "RKSU (rsuntk)")
              curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s v3.2.2-10-legacy
              ;;
            "XXKSU (backslashxx)")
              curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
              ;;
            "KOWX712 (KOWX712)")
              curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
              ;;
            "XXKSU-SUSFS (zenwav)")
              curl -LSs "https://raw.githubusercontent.com/zenwav/KernelSU-SUSFS/refs/heads/master/kernel/setup.sh" | bash -s master
              ;;
            *)
              curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -
              ;;
          esac

      - name: Compile Kernel
        id: build
        working-directory: ${{ steps.kernel.outputs.kernel_dir }}
        run: |
          git submodule init && git submodule update
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Nehal"
          export KBUILD_BUILD_HOST="GitHub-Actions"
          export CCACHE_BASEDIR="$PWD"
          export CCACHE_COMPILERCHECK=content

          make O=out CC="ccache clang" LLVM=1 LLVM_IAS=1 ${{ github.event.inputs.DEFCONFIG }}

          make -j$(nproc --all) O=out \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

          echo "::group::ccache Statistics"
          ccache -s
          echo "::endgroup::"

          elapsed=$(( $(date +\%s) -${{ steps.workspace.outputs.start_time }} ))
          echo "elapsed_time=$elapsed" >> $GITHUB_OUTPUT

      - name: Package with AnyKernel3
        id: anykernel
        if: ${{ success() && github.event.inputs.ANYKERNEL_URL != '' }}
        working-directory: ${{ steps.kernel.outputs.kernel_dir }}
        run: |
          git clone --depth=1 ${{ github.event.inputs.ANYKERNEL_URL }} -b${{ github.event.inputs.ANYKERNEL_BRANCH }} AnyKernel3

          if [ -f out/arch/arm64/boot/Image ]; then
            cp -f out/arch/arm64/boot/Image AnyKernel3/
            [ -f out/arch/arm64/boot/dtbo.img ] && cp -f out/arch/arm64/boot/dtbo.img AnyKernel3/
            [ -f out/arch/arm64/boot/dtb.img ] && cp -f out/arch/arm64/boot/dtb.img AnyKernel3/dtb
          elif [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp -f out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
            [ -f out/arch/arm64/boot/dtbo.img ] && cp -f out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi

          BUILD_DATE=$(date +'%Y%m%d')
          KSU_TAG="-NOKSU"
          SUSFS_TAG=""

          if [ "${{ github.event.inputs.ENABLE_KERNELSU }}" = "true" ]; then
            KSU_CHOICE="${{ github.event.inputs.WHICH_KSU }}"
            KSU_TAG="-KSU"
            if echo "$KSU_CHOICE" | grep -iq "susfs" || [ -d "KernelSU/kernel/susfs" ] || [ -f "include/linux/susfs.h" ]; then
              SUSFS_TAG="-SuSFS"
            fi
          fi

          ZIP_NAME="strongerkernel-${{ github.event.inputs.CODENAME }}-${BUILD_DATE}${KSU_TAG}${SUSFS_TAG}-v${{ github.run_number }}.zip"

          cd AnyKernel3
          zip -r9 "$ZIP_NAME" * -x README "$ZIP_NAME"
          mv "$ZIP_NAME" ../out/arch/arm64/boot/
          echo "zipname=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          preserve_order: true
          files: |
            ${{ steps.kernel.outputs.kernel_dir }}/out/.config
            ${{ steps.kernel.outputs.kernel_dir }}/out/arch/arm64/boot/Image*
            ${{ steps.kernel.outputs.kernel_dir }}/out/arch/arm64/boot/dtb*
            ${{ steps.kernel.outputs.kernel_dir }}/out/arch/arm64/boot/*.zip
          name: strongerkernel-${{ github.event.inputs.CODENAME }}-${{ github.run_number }}
          tag_name: build-${{ github.run_number }}
          body: |
            **${{ steps.workspace.outputs.build_title }}**
            - **Device:** `${{ github.event.inputs.CODENAME }}`
            - **Tree:** [${{ github.event.inputs.KERNEL_TREE }}](${{ github.event.inputs.KERNEL_TREE }}/tree/${{ github.event.inputs.KERNEL_TREE_BRANCH }})
            - **Defconfig:** `${{ github.event.inputs.DEFCONFIG }}`
            - **KernelSU:** ${{ (github.event.inputs.ENABLE_KERNELSU == 'true' || github.event.inputs.ENABLE_KERNELSU == true) && github.event.inputs.WHICH_KSU || 'Disabled' }}
            - **Build Duration:** ${{ steps.build.outputs.elapsed_time }}s
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
