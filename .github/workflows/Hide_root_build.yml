name: hide root build release FD-release-munch-builder

permissions:
  contents: write

on:
  pull_request:
  workflow_dispatch:
    inputs:
      KERNEL_TREE_1:
        description: 'Kernel Tree'
        default: 'https://github.com/strong568/kernel_xiaomi_sm8250'
        required: true
      KERNEL_TREE_BRANCH_1:
        description: 'Kernel Tree Branch 1'
        default: 'freesia'
        required: true
      CODENAME:
        description: 'Codename (do not change)'
        default: 'munch'
        required: true
      ANYKERNEL_URL:
        description: 'AnyKernel Url (leave blank if you dont want AnyKernel)'
        default: 'https://github.com/re-noroi/anykernel3-test'
        required: false
      CUSTOM_SED:
        description: 'Custom Kernel Version'
        default: '-perf+'
        required: false
      COMPILER:
        description: 'Choose compiler'
        required: true
        type: choice
        options:
          - neutron
          - r547379
          - r574158
          - r614150
        default: neutron
      VARIANT:
        description: '-W is only for rename'
        required: true
        type: choice
        options:
          - stock
          - W-variant
          - oplus-variant
        default: stock
      LTO_CHOICE:
        required: true
        type: choice
        options:
          - full_lto
          - thin_lto
        default: full_lto
      ENABLE_NTSYNC:
        description: '[Extra] Enable NT synchronization (NTSYNC)'
        required: false
        type: boolean
        default: true
      ENABLE_NOMOUNT:
        description: '[Extra] Enable NoMount support (BẬT (full_lto) là treo boot animation)'
        required: true
        type: boolean
        default: false

      ENABLE_RW_SWAPPINESS:
        description: '[Extra] Allow modification of swappiness'
        required: false
        type: boolean
        default: false
      ENABLE_BYPASS_CHARGING:
        description: '[Extra] Enable bypass charging'
        required: true
        type: boolean
        default: false
      ENABLE_RELEASE:
        description: 'Upload build to GitHub Releases'
        required: true
        type: boolean
        default: true

jobs:
  build:
    strategy:
      matrix:
        kernel: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    env:
      UPLOAD_TO_RELEASE: false

    steps:
      - name: Install Dependencies
        run: sudo apt install -y flex libncurses6

      - name: Download & Extract Clang
        run: |
          if [[ "${{ github.event.inputs.COMPILER }}" == "r547379" ]]; then
            wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -O clang.tar.gz
            mkdir clang
            tar -xf clang.tar.gz -C clang
          elif [[ "${{ github.event.inputs.COMPILER }}" == "r574158" ]]; then
            wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/ebcc6c3bef363bc539ea39f45b6abae1dce6ff1a/clang-r574158.tar.gz -O clang.tar.gz
            mkdir clang
            tar -xf clang.tar.gz -C clang
          elif [[ "${{ github.event.inputs.COMPILER }}" == "r614150" ]]; then
            wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/747f0cceb48f48bf7cf497a3e01af1389266904b/clang-r614150.tar.gz -O clang.tar.gz
            mkdir clang
            tar -xf clang.tar.gz -C clang
          else
            wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst -O clang.tar.zst
            mkdir clang
            unzstd -d clang.tar.zst
            tar -xf clang.tar -C clang
          fi
          
      - name: Set Kernel Environment Variables
        run: |
          echo "KERNEL_TREE_BRANCH=${{ github.event.inputs.KERNEL_TREE_BRANCH_1 }}" >> $GITHUB_ENV
         
      - name: Checkout Kernel via PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [[ "${{ github.event.inputs.KERNEL_TREE_1 }}" == "private" ]]; then
            REPO_URL="https://x-access-token:${GH_PAT}@github.com/re-noroi/FD-private.git"
          else
            REPO_URL="${{ github.event.inputs.KERNEL_TREE_1 }}"
          fi
          git clone --depth=1 --branch "${{ env.KERNEL_TREE_BRANCH }}" "${REPO_URL}" kernel_tree

      - name: Kernel Version
        run: |
          cd kernel_tree
          EXTRA=""
          if [[ "${{ github.event.inputs.VARIANT }}" == "W-variant" ]]; then
            EXTRA="-W"
          elif [[ "${{ github.event.inputs.VARIANT }}" == "oplus-variant" ]]; then
            EXTRA="-oplus"
          fi
          sed -i 's/CONFIG_LOCALVERSION="-FakeDreamer"/CONFIG_LOCALVERSION="'"${{ github.event.inputs.CUSTOM_SED }}${EXTRA}"'"/' arch/arm64/configs/vendor/munch_defconfig

      - name: Remove KSU (Apply only for kernel 2)
        if: matrix.kernel == 2
        run: |
          cd kernel_tree
          sed -i -e '/CONFIG_KSU=y/c\# CONFIG_KSU is not set;' arch/arm64/configs/vendor/munch_defconfig
          sed -i -e '/CONFIG_KSU_TAMPER_SYSCALL_TABLE=y/c\# CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set;' arch/arm64/configs/vendor/munch_defconfig
          sed -i -e '/CONFIG_KSU_FEATURE_SULOG=y/c\# CONFIG_KSU_FEATURE_SULOG is not set;' arch/arm64/configs/vendor/munch_defconfig
          sed -i -e '/CONFIG_KSU_FEATURE_ADBROOT=y/c\# CONFIG_KSU_FEATURE_ADBROOT is not set;' arch/arm64/configs/vendor/munch_defconfig
          sed -i -e '/CONFIG_KSU_LSM_SECURITY_HOOKS=y/c\# CONFIG_KSU_LSM_SECURITY_HOOKS is not set;' arch/arm64/configs/vendor/munch_defconfig
          sed -i -e '/CONFIG_KSU_HEURISTIC_IN_TREE_BUILD=y/c\# CONFIG_KSU_HEURISTIC_IN_TREE_BUILD is not set;' arch/arm64/configs/vendor/munch_defconfig

      - name: Revert to stock gpufreq
        if: matrix.kernel == 3 || matrix.kernel == 4
        run: |
          cd kernel_tree
          patch -p1 -f < "0001-stock-gpu-freq.patch"

      - name: Disable MLGO flags for Neutron Clang
        if: ${{ github.event.inputs.COMPILER == 'neutron' }}
        run: |
          cd kernel_tree
          sed -i -e '/regalloc-enable-advisor/s/^/#/' -e '/enable-ml-inliner/s/^/#/' Makefile

      - name: Change LTO Type
        if: ${{ github.event.inputs.LTO_CHOICE == 'thin_lto' }}
        run: |
          cd kernel_tree
          sed -i -e '/# CONFIG_LTO_CLANG_THIN is not set/c\CONFIG_LTO_CLANG_THIN=y;' arch/arm64/configs/vendor/munch_defconfig
          sed -i -e '/CONFIG_LTO_CLANG_FULL=y/c\# CONFIG_LTO_CLANG_FULL is not set;' arch/arm64/configs/vendor/munch_defconfig

      - name: Oplus Features
        if: ${{ github.event.inputs.VARIANT == 'oplus-variant' }}
        run: |
          cd kernel_tree
          sed -i -e '/# CONFIG_OPLUS_PORT is not set/c\CONFIG_OPLUS_PORT=y;' arch/arm64/configs/vendor/munch_defconfig

      - name: Apply Custom Feature Switches
        run: |
          cd kernel_tree
          DEFCONFIG="arch/arm64/configs/vendor/munch_defconfig"
          
          chmod +x ./scripts/config

          toggle_config() {
            local feature=$1
            local state=$2
            
            if [[ "$state" == 'true' ]]; then
              echo "  [+] Enabling $feature"
              ./scripts/config --file $DEFCONFIG --enable "$feature"
            else
              echo "  [-] Disabling $feature"
              ./scripts/config --file $DEFCONFIG --disable "$feature"
            fi
          }

          echo "==== Applying Extra Features & Security Patches ===="
          toggle_config "CONFIG_NTSYNC" "${{ github.event.inputs.ENABLE_NTSYNC }}"
          toggle_config "CONFIG_NOMOUNT" "${{ github.event.inputs.ENABLE_NOMOUNT }}"
          toggle_config "CONFIG_RW_SWAPPINESS" "${{ github.event.inputs.ENABLE_RW_SWAPPINESS }}"
          toggle_config "CONFIG_BYPASS_CHARGING" "${{ github.event.inputs.ENABLE_BYPASS_CHARGING }}"
          
          # Tắt các cờ lộ thông tin kernel / debug chống quét ngân hàng
          ./scripts/config --file $DEFCONFIG --disable "CONFIG_LOCALVERSION_AUTO"
          ./scripts/config --file $DEFCONFIG --disable "CONFIG_IKCONFIG_PROC"
          ./scripts/config --file $DEFCONFIG --disable "CONFIG_KSU_FEATURE_ADBROOT"
          ./scripts/config --file $DEFCONFIG --disable "CONFIG_KALLSYMS"
          echo "=================================================="

      - name: Apply Modifications (if modified build)
        if: matrix.kernel == 2 || matrix.kernel == 4
        run: |
          cd kernel_tree
          sed -i -e '/<2553600>,/c\<2553600>;' arch/arm64/boot/dts/vendor/qcom/kona.dtsi
          sed -i -e '/<2649600>,/c\//<2649600>,' arch/arm64/boot/dts/vendor/qcom/kona.dtsi
          sed -i -e '/<2745600>,/c\//<2745600>,' arch/arm64/boot/dts/vendor/qcom/kona.dtsi
          sed -i -e '/<2841600>,/c\//<2841600>,' arch/arm64/boot/dts/vendor/qcom/kona.dtsi
          sed -i -e '/<3187200>;/c\//<3187200>;' arch/arm64/boot/dts/vendor/qcom/kona.dtsi
          sed -i -e 's/qcom,mdss-pan-physical-width-dimension = <70>;/qcom,mdss-pan-physical-width-dimension = <695>;/' arch/arm64/boot/dts/vendor/qcom/dsi-panel-l11r-38-08-0a-dsc-cmd.dtsi
          sed -i -e 's/qcom,mdss-pan-physical-height-dimension = <155>;/qcom,mdss-pan-physical-height-dimension = <1546>;/' arch/arm64/boot/dts/vendor/qcom/dsi-panel-l11r-38-08-0a-dsc-cmd.dtsi
      
      - name: Build Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=ARM64
          export KBUILD_BUILD_USER="strong568"
          export KBUILD_BUILD_HOST="dreamstate"
          export KBUILD_BUILD_TIMESTAMP="$(TZ=UTC-7 date)"
          cd kernel_tree
          make O=out vendor/munch_defconfig

          # --- HÀM TỰ ĐỘNG CHÈN CẤU HÌNH VÀO FILE .CONFIG ĐẦY ĐỦ 6000 DÒNG ---
          apply_anti_detection() {
              local CONFIG_FILE="out/.config"
              chmod +x ./scripts/config

              if [[ "${{ matrix.kernel }}" != "2" ]]; then
                  echo "[*] Injecting Anti-Detection KSU + SuSFS Configuration (Pass VCB, MBBank, VNeID)..."
                  ./scripts/config --file "$CONFIG_FILE" \
                      -e KSU \
                      -e KSU_SUSFS \
                      -e KSU_MULTI_MANAGER_SUPPORT \
                      -e THREAD_INFO_IN_TASK \
                      -d KSU_DEBUG \
                      -d KSU_KPROBES_HOOK \
                      -d KSU_TRACEPOINT_HOOK \
                      -d KSU_MANUAL_HOOK \
                      -d KSU_DISABLE_MANAGER \
                      -d KSU_DISABLE_POLICY \
                      -e KSU_SUSFS_SUS_PATH \
                      -e KSU_SUSFS_SUS_MOUNT \
                      -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
                      -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
                      -e KSU_SUSFS_SUS_KSTAT \
                      -e KSU_SUSFS_SPOOF_UNAME \
                      -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                      -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                      -e KSU_SUSFS_OPEN_REDIRECT \
                      -e KSU_SUSFS_SUS_MAP \
                      -d KSU_SUSFS_ENABLE_LOG \
                      -d KSU_SUSFS_SUS_SU \
                      -d KSU_SUSFS_SUS_OVERLAYFS
              fi

              # --- CÁC CỜ HARDENING KERNEL BẮT BUỘC ĐỂ VƯỢT QUA VCB, MBBANK, VNEID ---
              echo "[*] Hardening Kernel Configuration (Pass VCB, MBBank, VNeID)..."
              ./scripts/config --file "$CONFIG_FILE" \
                  -d KPROBES \
                  -d HAVE_KPROBES \
                  -d KPROBE_EVENTS \
                  -d UPROBE_EVENTS \
                  -d KALLSYMS_ALL \
                  -e SECURITY_SELINUX \
                  -d SECURITY_SELINUX_DEVELOP \
                  -d SECURITY_SELINUX_PERMISSIVE_DONTAUDIT \
                  -d DEBUG_FS \
                  -d PROC_KCORE \
                  -d DEVMEM \
                  -d DEVKMEM
          }

          # Gọi hàm apply_anti_detection
          apply_anti_detection

          # Tự động đồng bộ và chốt cấu hình Kconfig
          make O=out olddefconfig

          make O=out CC=clang -j$(nproc --all) CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1
          if [[ "${{ matrix.kernel }}" == 1 ]]; then
            cp out/arch/arm64/boot/Image.gz ../Image.gz
            mv out/arch/arm64/boot/dtbo.img ../munch-aosp-dtbo.img
            mv out/arch/arm64/boot/dtb.img ../munch-normal-dtb
          elif [[ "${{ matrix.kernel }}" == 2 ]]; then
            cp out/arch/arm64/boot/Image.gz ../Image.gz
            mv out/arch/arm64/boot/dtbo.img ../munch-miui-dtbo.img
            mv out/arch/arm64/boot/dtb.img ../munch-effcpu-dtb
          elif [[ "${{ matrix.kernel }}" == 3 ]]; then
            mv out/arch/arm64/boot/dtb.img ../munch-normal-gpustk-dtb
          else
            mv out/arch/arm64/boot/dtb.img ../munch-effcpu-gpustk-dtb
          fi

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.kernel == 1 || matrix.kernel == 2
        with:
          name: kernel-${{ matrix.kernel }}-base
          path: |
            Image.gz

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.kernel == 1
        with:
          name: kernel-part-${{ matrix.kernel }}-addon
          path: |
            munch-aosp-dtbo.img
            munch-normal-dtb

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.kernel == 2
        with:
          name: kernel-part-${{ matrix.kernel }}-addon
          path: |
            munch-miui-dtbo.img
            munch-effcpu-dtb

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.kernel == 3
        with:
          name: kernel-part-${{ matrix.kernel }}-addon
          path: |
            munch-normal-gpustk-dtb

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.kernel == 4
        with:
          name: kernel-part-${{ matrix.kernel }}-addon
          path: |
            munch-effcpu-gpustk-dtb

  package_anykernel:
    needs: build
    strategy:
      matrix:
        kernel: [1, 2]
    runs-on: ubuntu-latest

    steps:
      - name: Install Zip Utility
        run: sudo apt install -y zip

      - name: Download Kernel Build Image
        uses: actions/download-artifact@v4
        with:
          name: kernel-${{ matrix.kernel }}-base
          path: ak3/

      - name: Download Kernel Build Addon 1
        uses: actions/download-artifact@v4
        with:
          name: kernel-part-1-addon
          path: ak3/

      - name: Download Kernel Build Addon 2
        uses: actions/download-artifact@v4
        with:
          name: kernel-part-2-addon
          path: ak3/

      - name: Download Kernel Build Addon 3
        uses: actions/download-artifact@v4
        with:
          name: kernel-part-3-addon
          path: ak3/

      - name: Download Kernel Build Addon 4
        uses: actions/download-artifact@v4
        with:
          name: kernel-part-4-addon
          path: ak3/

      - name: Clone AnyKernel3
        run: |
          git clone --recursive --depth=1 ${{ github.event.inputs.ANYKERNEL_URL }} -b munch ak3_base
          cp -r ak3/* ak3_base/
          rm -rf ak3_base/.git ak3_base/.github

      - name: Package AnyKernel Zip
        run: |
          COMPILED_DATE=$(date +%Y%m%d)
          EXTRA2=""
          if [[ "${{ github.event.inputs.VARIANT }}" == "W-variant" ]]; then
            EXTRA2="-W"
          elif [[ "${{ github.event.inputs.VARIANT }}" == "oplus-variant" ]]; then
            EXTRA2="-OPLUS"
          fi
          
          if [[ "${{ matrix.kernel }}" == "1" ]]; then
            ZIP_NAME="[FD-strong568-][ksu-${{ github.event.inputs.CODENAME }}-${COMPILED_DATE}${EXTRA2}].zip"
            ARTIFACT_TAG="ksu-kernel"
          else
            ZIP_NAME="[FD-strong568-][noksu-${{ github.event.inputs.CODENAME }}-${COMPILED_DATE}${EXTRA2}].zip"
            ARTIFACT_TAG="noksu-kernel"
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd ak3_base
          zip -r9 "$GITHUB_WORKSPACE/dist/${ZIP_NAME}" ./*
          cd "$GITHUB_WORKSPACE"

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "ARTIFACT_TAG=${ARTIFACT_TAG}" >> $GITHUB_ENV

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip-${{ env.ARTIFACT_TAG }}
          path: dist/*.zip

  release:
    needs: package_anykernel
    runs-on: ubuntu-latest
    if: github.event.inputs.ENABLE_RELEASE == 'true'
    steps:
      - name: Create release directory
        run: mkdir -p release_files

      - name: Download All Packaged ZIPs
        uses: actions/download-artifact@v4
        with:
          pattern: "kernel-zip-*"
          merge-multiple: true
          path: release_files

      - name: Verify Files Before Release
        run: |
          ls -la release_files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ github.run_id }}"
          name: "Kernel Munch Release - ${{ github.run_number }}"
          body: |
            ### Build Information
            - **Device**: ${{ github.event.inputs.CODENAME }}
            - **Compiler**: ${{ github.event.inputs.COMPILER }}
            - **Variant**: ${{ github.event.inputs.VARIANT }}
            - **Commit**: ${{ github.sha }}
          draft: false
          prerelease: false
          files: release_files/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
